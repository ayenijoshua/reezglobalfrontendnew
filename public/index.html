  .loader {

    z-index: 9998;
    display: flex;
    justify-content: center;

  .loading-logo {
    width: 120px;
    height: auto;
    animation: pulse 1.5s infinite ease-in-out;

    100% { transform: scale(1); opacity: 1; }
  }
